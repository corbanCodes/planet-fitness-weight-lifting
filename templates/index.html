<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="description" content="A private lifting log for the Planet Fitness machine circuit.">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>&#9876;</text></svg>">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 9v6M7 7v10M20 9v6M17 7v10M7 12h10"/>
  </symbol>
  <symbol id="i-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9v6M9 7v10M18 9v6M15 7v10M9 12h6"/>
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
  </symbol>
  <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  </symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5A2 2 0 0 1 6 3.5h13v17H6a2 2 0 0 0-2 2z"/><path d="M4 18.5h15"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5l5 5 10-11"/>
  </symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V15h7v-1.1A6 6 0 0 0 12 3z"/>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.4"/>
  </symbol>
  <symbol id="i-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3c3.5 4 6 6.2 6 10a6 6 0 1 1-12 0c0-2 1-3.5 2.5-5 .3 1.4 1 2.2 2 2.5C10 8 10.5 5.5 12 3z"/>
  </symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11a8 8 0 1 0-2.6 6.4"/><path d="M20 4.5V11h-6"/>
  </symbol>
</svg>

<header class="app">
  <div class="wrap head-row">
    <svg class="mark"><use href="#i-mark"/></svg>
    <div>
      <div class="head-title">Lift Log</div>
      <div class="head-sub" id="head-sub">Planet Fitness circuit</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel active" id="panel-today"></section>
  <section class="panel" id="panel-schedule"></section>
  <section class="panel" id="panel-history"></section>
  <section class="panel" id="panel-glossary"></section>
</main>

<nav class="tabs" role="tablist">
  <div class="inner">
    <button role="tab" data-tab="today" aria-selected="true">
      <svg><use href="#i-today"/></svg>Today</button>
    <button role="tab" data-tab="schedule" aria-selected="false">
      <svg><use href="#i-calendar"/></svg>Schedule</button>
    <button role="tab" data-tab="history" aria-selected="false">
      <svg><use href="#i-history"/></svg>History</button>
    <button role="tab" data-tab="glossary" aria-selected="false">
      <svg><use href="#i-book"/></svg>Terms</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>window.BOOTSTRAP = {{ bootstrap|safe }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
